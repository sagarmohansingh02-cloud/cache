name: Cache

options:
  bundleIdPrefix: com.sagarmohansingh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Cache:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: SupaClip

    dependencies:
      - package: KeyboardShortcuts

    info:
      path: SupaClip/Info.plist
      properties:
        # Menu bar only — no Dock icon, no main window on launch.
        LSUIElement: true
        CFBundleName: Cache
        CFBundleDisplayName: Cache
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Sagarmohan Singh. All rights reserved."

    entitlements:
      path: SupaClip/SupaClip.entitlements
      properties:
        # App Sandbox OFF — required for file drag-out and, later, Accessibility.
        com.apple.security.app-sandbox: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagarmohansingh.supaclip
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        # macOS ties a privacy grant to the app's code signature. Ad-hoc
        # signing ("-") produces a fresh signature on every build, so the system
        # sees a different app each time and re-asks for permission it already
        # granted. Set CACHE_SIGN_IDENTITY to a stable identity — a free
        # self-signed code-signing certificate is enough — and the grant sticks
        # across rebuilds. Falls back to ad-hoc so a plain `xcodegen && xcodebuild`
        # still works with no setup.
        CODE_SIGN_IDENTITY: "$(CACHE_SIGN_IDENTITY:default=-)"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Cache:
    build:
      targets:
        Cache: all
    run:
      config: Debug
    archive:
      config: Release
