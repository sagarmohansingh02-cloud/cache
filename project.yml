name: Cache

options:
  bundleIdPrefix: com.sagarmohansingh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Cache:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Cache

    dependencies:
      - package: KeyboardShortcuts

    info:
      path: Cache/Info.plist
      properties:
        # Menu bar only — no Dock icon, no main window on launch.
        LSUIElement: true
        CFBundleName: Cache
        CFBundleDisplayName: Cache
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Sagarmohan Singh. All rights reserved."
        # Shown in the macOS prompt when Cache first opens the screenshot folder.
        NSDesktopFolderUsageDescription: "Cache watches your screenshot folder so each new screenshot appears in the notch."
        NSDocumentsFolderUsageDescription: "Cache watches your screenshot folder so each new screenshot appears in the notch."
        NSDownloadsFolderUsageDescription: "Cache watches your screenshot folder so each new screenshot appears in the notch."

    entitlements:
      path: Cache/Cache.entitlements
      properties:
        # App Sandbox OFF — required to read the screenshot folder and to drag files out.
        com.apple.security.app-sandbox: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagarmohansingh.cache
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        # macOS ties a privacy grant to the app's code signature. Ad-hoc
        # signing ("-") produces a fresh signature on every build, so the system
        # sees a different app each time and re-asks for permission it already
        # granted. Set CACHE_SIGN_IDENTITY to a stable identity — a free
        # self-signed code-signing certificate is enough — and the grant sticks
        # across rebuilds. Falls back to ad-hoc so a plain `xcodegen && xcodebuild`
        # still works with no setup.
        CODE_SIGN_IDENTITY: "$(CACHE_SIGN_IDENTITY:default=-)"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Debug runs get their own identity, so running from Xcode never touches
        # the history, settings or login item of the copy in /Applications.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.sagarmohansingh.cache.dev

schemes:
  Cache:
    build:
      targets:
        Cache: all
    run:
      config: Debug
    archive:
      config: Release
